services:
  - type: web
    name: creative-ad-generation
    runtime: docker
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: WORKSPACE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_SERVICE_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: EPHEMERAL_STORAGE
        value: "1"
